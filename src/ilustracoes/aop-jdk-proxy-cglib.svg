  <text x="780" y="362" text-anchor="middle" class="codigo">PedidoService</text>
  <text x="624" y="294" class="rotulo">proxy</text>
  <g class="anotacao">
    <text x="100" y="330" class="nota">o Spring põe um proxy na frente</text>
