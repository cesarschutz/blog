<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690"
  aria-label="Animação: as transações A e B debitam a mesma conta. No otimista, as duas leem a version 1, A grava, e o UPDATE de B atinge 0 linhas, então B relê a version 2 e grava. No pessimista, A trava a linha com FOR UPDATE, e B espera o COMMIT de A para ler o saldo 90.">
