  <text x="40" y="46" class="titulo-caixa">Otimista</text>
  <text x="178" y="46" class="texto-caixa">detecta o conflito ao gravar</text>
  <text x="40" y="392" class="titulo-caixa">Pessimista</text>
  <text x="206" y="392" class="texto-caixa">evita o conflito antes</text>

  <text x="60" y="112" class="titulo-caixa">Transação A</text>
  <g class="tom-verde">
    <text x="60" y="206" class="codigo texto-tom">UPDATE 1</text>
  </g>

  <g data-marca="banco" class="tom-roxo" transform="translate(466 82) scale(0.38)"/>
