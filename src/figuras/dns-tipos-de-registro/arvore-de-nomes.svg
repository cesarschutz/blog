<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"
  aria-label="O espaço de nomes do DNS como árvore, em quatro níveis: a raiz, os TLDs com, org e br, o domínio registrado example, embaixo do com, e os subdomínios www e blog, embaixo de example. Cada contorno é uma zona: a da raiz e as dos três TLDs, em roxo, só delegam; a de example.com, em verde, guarda example, www e blog. As setas roxas são as delegações por NS, da raiz para cada TLD e do com para example.com. Números em azul marcam o caminho de www até a raiz, e ao lado o nome completo, www.example.com., é lido de baixo para cima, com o ponto final no lugar da raiz.">
  <g class="tinta">
    <g class="tom-roxo">
      <rect x="520" y="34" width="280" height="122" rx="18" class="lavado"/>
      <rect x="520" y="34" width="280" height="122" rx="18" class="linha-tom"/>
      <rect x="310" y="250" width="220" height="130" rx="18" class="lavado"/>
      <rect x="310" y="250" width="220" height="130" rx="18" class="linha-tom"/>
      <rect x="550" y="250" width="220" height="130" rx="18" class="lavado"/>
      <rect x="550" y="250" width="220" height="130" rx="18" class="linha-tom"/>
      <rect x="790" y="250" width="220" height="130" rx="18" class="lavado"/>
      <rect x="790" y="250" width="220" height="130" rx="18" class="linha-tom"/>
      <path d="M650 113 C580 170 420 165 420 284 M411 270 L420 284 L429 270" class="linha-tom"/>
      <path d="M660 115 V284 M651 270 L660 284 L669 270" class="linha-tom"/>
      <path d="M670 113 C740 170 900 165 900 284 M891 270 L900 284 L909 270" class="linha-tom"/>
    </g>
    <g class="tom-verde">
      <rect x="230" y="440" width="380" height="320" rx="18" class="lavado"/>
      <rect x="230" y="440" width="380" height="320" rx="18" class="linha-tom"/>
    </g>
    <g class="tom-roxo">
      <path d="M420 340 V475 M411 461 L420 475 L429 461" class="linha-tom"/>
    </g>
    <g class="tom-azul">
      <rect x="687" y="477" width="490" height="250" rx="14" class="hachura"/>
      <rect x="680" y="470" width="490" height="250" rx="14" class="lavado"/>
      <rect x="680" y="470" width="490" height="250" rx="14" class="linha"/>
    </g>
    <circle cx="665" cy="93" r="26" class="hachura"/>
    <circle cx="660" cy="88" r="26" class="papel"/>
    <circle cx="660" cy="88" r="26" class="linha"/>
    <rect x="375" y="295" width="100" height="48" rx="24" class="hachura"/>
    <rect x="370" y="290" width="100" height="48" rx="24" class="papel"/>
    <rect x="370" y="290" width="100" height="48" rx="24" class="linha"/>
    <rect x="615" y="295" width="100" height="48" rx="24" class="hachura"/>
    <rect x="610" y="290" width="100" height="48" rx="24" class="papel"/>
    <rect x="610" y="290" width="100" height="48" rx="24" class="linha"/>
    <rect x="855" y="295" width="100" height="48" rx="24" class="hachura"/>
    <rect x="850" y="290" width="100" height="48" rx="24" class="papel"/>
    <rect x="850" y="290" width="100" height="48" rx="24" class="linha"/>
    <path d="M400 529 L352 664 M440 529 L488 664" class="linha"/>
    <rect x="350" y="486" width="150" height="48" rx="24" class="hachura"/>
    <rect x="345" y="481" width="150" height="48" rx="24" class="papel"/>
    <rect x="345" y="481" width="150" height="48" rx="24" class="linha"/>
    <rect x="295" y="671" width="100" height="48" rx="24" class="hachura"/>
    <rect x="290" y="666" width="100" height="48" rx="24" class="papel"/>
    <rect x="290" y="666" width="100" height="48" rx="24" class="linha"/>
    <rect x="455" y="671" width="100" height="48" rx="24" class="hachura"/>
    <rect x="450" y="666" width="100" height="48" rx="24" class="papel"/>
    <rect x="450" y="666" width="100" height="48" rx="24" class="linha"/>
  </g>

  <text x="30" y="84" class="texto-caixa">raiz</text>
  <text x="30" y="110" class="nota-pequena">zona da IANA</text>
  <text x="30" y="310" class="texto-caixa">TLDs</text>
  <text x="30" y="336" class="nota-pequena">cada um, uma zona</text>
  <text x="30" y="500" class="texto-caixa">domínio registrado</text>
  <text x="30" y="526" class="nota-pequena">a zona do dono</text>
  <text x="30" y="686" class="texto-caixa">subdomínios</text>
  <text x="30" y="712" class="nota-pequena">na mesma zona</text>

  <g transform="translate(660 92) scale(2)"><text x="0" y="0" text-anchor="middle" class="codigo">.</text></g>
  <text x="420" y="322" text-anchor="middle" class="codigo">com</text>
  <text x="660" y="322" text-anchor="middle" class="codigo">org</text>
  <text x="900" y="322" text-anchor="middle" class="codigo">br</text>
  <text x="420" y="513" text-anchor="middle" class="codigo">example</text>
  <text x="340" y="698" text-anchor="middle" class="codigo">www</text>
  <text x="500" y="698" text-anchor="middle" class="codigo">blog</text>

  <g class="tom-roxo">
    <text x="404" y="236" text-anchor="end" class="codigo texto-tom">NS</text>
    <text x="674" y="210" class="codigo texto-tom">NS</text>
    <text x="916" y="236" class="codigo texto-tom">NS</text>
    <text x="434" y="420" class="codigo texto-tom">NS</text>
  </g>

  <g class="tom-azul">
    <circle cx="262" cy="690" r="16" class="selo"/>
    <text x="262" y="691" class="selo-texto">1</text>
    <circle cx="317" cy="505" r="16" class="selo"/>
    <text x="317" y="506" class="selo-texto">2</text>
    <circle cx="342" cy="314" r="16" class="selo"/>
    <text x="342" y="315" class="selo-texto">3</text>
    <circle cx="606" cy="82" r="16" class="selo"/>
    <text x="606" y="83" class="selo-texto">4</text>

    <text x="706" y="516" class="texto-caixa">o nome completo, lido de baixo para cima</text>
    <circle cx="769" cy="566" r="16" class="selo"/>
    <text x="769" y="567" class="selo-texto">1</text>
    <circle cx="913" cy="566" r="16" class="selo"/>
    <text x="913" y="567" class="selo-texto">2</text>
    <circle cx="1057" cy="566" r="16" class="selo"/>
    <text x="1057" y="567" class="selo-texto">3</text>
    <circle cx="1105" cy="566" r="16" class="selo"/>
    <text x="1105" y="567" class="selo-texto">4</text>
    <g transform="translate(733 640) scale(1.6)"><text x="0" y="0" class="codigo">www.example.com.</text></g>
    <text x="1150" y="690" text-anchor="end" class="nota-pequena">o ponto final é a raiz</text>
  </g>
</svg>
