    <text x="625" y="102" text-anchor="middle" class="texto-caixa">o topo</text>
    <text x="780" y="72" text-anchor="middle" class="titulo-caixa">TLD</text>
    <text x="780" y="102" text-anchor="middle" class="texto-caixa">o com</text>
  </g>
  <g class="tom-verde">
    <text x="980" y="72" text-anchor="middle" class="titulo-caixa">Autoritativo</text>
    <text x="980" y="102" text-anchor="middle" class="texto-caixa">de example.com</text>
  </g>

  <g data-passo="1">
    <g class="tom-azul">
      <circle cx="42" cy="190" r="19" class="selo"/>
      <text x="42" y="191" class="selo-texto">1</text>
      <text x="307" y="176" text-anchor="middle" class="codigo">www.example.com</text>
      <text x="307" y="222" text-anchor="middle" class="texto-caixa texto-tom">qual o endereço?</text>
      <path d="M187 190 H410" pathLength="1" class="trajeto"/>
    </g>
  </g>

  <g data-passo="2">
    <g class="tom-roxo">
      <circle cx="42" cy="290" r="19" class="selo"/>
      <text x="42" y="291" class="selo-texto">2</text>
    </g>
    <g class="tom-petroleo">
      <text x="527" y="276" text-anchor="middle" class="texto-caixa texto-tom">pergunta</text>
      <path d="M432 290 H605" pathLength="1" class="trajeto"/>
    </g>
    <g class="tom-roxo etapa-2">
      <text x="527" y="336" text-anchor="middle" class="texto-caixa texto-tom">NS do com</text>
      <path d="M623 350 H450" pathLength="1" class="trajeto"/>
    </g>
  </g>

  <g data-passo="3">
    <g class="tom-roxo">
