      <rect x="565" y="30" width="120" height="88" rx="12" class="lavado"/>
      <rect x="565" y="30" width="120" height="88" rx="12" class="linha"/>
      <rect x="727" y="37" width="120" height="88" rx="12" class="hachura"/>
      <rect x="720" y="30" width="120" height="88" rx="12" class="lavado"/>
      <rect x="720" y="30" width="120" height="88" rx="12" class="linha"/>
    </g>
    <g class="tom-verde">
      <rect x="882" y="37" width="210" height="88" rx="12" class="hachura"/>
      <rect x="875" y="30" width="210" height="88" rx="12" class="lavado"/>
      <rect x="875" y="30" width="210" height="88" rx="12" class="linha"/>
    </g>

    <g data-passo="1" class="tom-azul">
      <path d="M185 190 H416 M402 181 L416 190 L402 199" class="linha-tom"/>
    </g>

    <g data-passo="2">
      <g class="tom-petroleo">
        <path d="M430 290 H611 M597 281 L611 290 L597 299" class="linha-tom"/>
      </g>
      <g class="tom-roxo etapa-2">
        <path d="M625 350 H445" class="linha-tom"/>
        <path d="M458 341 L444 350 L458 359" class="linha-tom"/>
      </g>
    </g>

    <g data-passo="3">
      <g class="tom-petroleo">
        <path d="M430 430 H766 M752 421 L766 430 L752 439" class="linha-tom"/>
      </g>
      <g class="tom-roxo etapa-2">
        <path d="M780 490 H445" class="linha-tom"/>
        <path d="M458 481 L444 490 L458 499" class="linha-tom"/>
      </g>
    </g>

    <g data-passo="4">
      <g class="tom-petroleo">
        <path d="M430 570 H966 M952 561 L966 570 L952 579" class="linha-tom"/>
      </g>
      <g class="tom-verde etapa-2">
        <path d="M980 640 H445" class="linha-tom"/>
        <path d="M458 631 L444 640 L458 649" class="linha-tom"/>
      </g>
    </g>

    <g data-passo="5">
      <g class="tom-petroleo">
        <rect x="310" y="700" width="240" height="68" rx="8" class="lavado"/>
        <rect x="310" y="700" width="240" height="68" rx="8" class="linha"/>
