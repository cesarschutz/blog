<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950"
  aria-label="Diagrama de sequência em cinco passos, com o navegador, o resolvedor, a raiz, o TLD com e o servidor autoritativo de example.com: o navegador pergunta ao resolvedor o endereço de www.example.com; o resolvedor pergunta à raiz, que não sabe o endereço e indica os servidores (NS) do com; pergunta ao servidor do com, que indica os servidores de example.com; pergunta ao autoritativo de example.com, que responde com o endereço e um TTL de 300 segundos; e o resolvedor guarda 172.66.147.243 no cache por 300 segundos e entrega o endereço ao navegador.">
  <path d="M185 124 V840 M430 124 V840 M625 124 V840 M780 124 V840 M980 124 V840" class="grade"/>

  <g class="tinta">
    <g class="tom-azul">
      <rect x="102" y="37" width="180" height="88" rx="12" class="hachura"/>
      <rect x="95" y="30" width="180" height="88" rx="12" class="lavado"/>
      <rect x="95" y="30" width="180" height="88" rx="12" class="linha"/>
    </g>
    <g class="tom-petroleo">
      <rect x="337" y="37" width="200" height="88" rx="12" class="hachura"/>
      <rect x="330" y="30" width="200" height="88" rx="12" class="lavado"/>
