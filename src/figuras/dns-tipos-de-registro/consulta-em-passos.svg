      <text x="527" y="416" text-anchor="middle" class="texto-caixa texto-tom">pergunta</text>
      <path d="M432 430 H760" pathLength="1" class="trajeto"/>
    </g>
    <g class="tom-roxo etapa-2">
      <text x="527" y="476" text-anchor="middle" class="texto-caixa texto-tom">NS de example.com</text>
      <path d="M778 490 H450" pathLength="1" class="trajeto"/>
    </g>
  </g>

  <g data-passo="4">
    <g class="tom-verde">
      <circle cx="42" cy="570" r="19" class="selo"/>
      <text x="42" y="571" class="selo-texto">4</text>
    </g>
    <g class="tom-petroleo">
      <text x="527" y="556" text-anchor="middle" class="texto-caixa texto-tom">pergunta</text>
      <path d="M432 570 H960" pathLength="1" class="trajeto"/>
    </g>
    <g class="tom-verde etapa-2">
      <text x="880" y="626" text-anchor="middle" class="texto-caixa texto-tom">o endereço</text>
      <text x="880" y="672" text-anchor="middle" class="texto-caixa texto-tom">TTL 300 s</text>
      <path d="M978 640 H450" pathLength="1" class="trajeto"/>
    </g>
  </g>

  <g data-passo="5">
    <g class="tom-petroleo">
      <circle cx="42" cy="734" r="19" class="selo"/>
      <text x="42" y="735" class="selo-texto">5</text>
    </g>
    <text x="430" y="728" text-anchor="middle" class="codigo">172.66.147.243</text>
    <text x="430" y="756" text-anchor="middle" class="texto-caixa">no cache, por 300 s</text>
    <g class="tom-petroleo etapa-2">
      <text x="307" y="796" text-anchor="middle" class="codigo">172.66.147.243</text>
      <path d="M428 810 H205" pathLength="1" class="trajeto"/>
    </g>
    <g class="tom-verde etapa-3">
      <text x="522" y="904" text-anchor="middle" class="texto-caixa texto-tom">O endereço chega ao navegador e fica no cache por 300 s.</text>
    </g>
