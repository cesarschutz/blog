        <rect x="195" y="860" width="605" height="70" rx="12" class="lavado"/>
        <rect x="195" y="860" width="605" height="70" rx="12" class="linha"/>
        <path d="M215 894 l11 11 l22 -24" class="linha-tom"/>
      </g>
    </g>
  </g>

  <g class="tom-azul">
    <text x="185" y="72" text-anchor="middle" class="titulo-caixa">Navegador</text>
    <text x="185" y="102" text-anchor="middle" class="texto-caixa">abre o site</text>
  </g>
  <g class="tom-petroleo">
    <text x="430" y="72" text-anchor="middle" class="titulo-caixa">Resolvedor</text>
    <text x="430" y="102" text-anchor="middle" class="texto-caixa">com o cache</text>
  </g>
  <g class="tom-roxo">
