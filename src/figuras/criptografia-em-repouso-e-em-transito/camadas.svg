<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700"
  aria-label="Quadro com quatro linhas e quatro lugares por onde o dado passa: aplicação, rede, servidor e disco. Só em trânsito, só a rede fica cifrada; só em repouso, só o disco; com os dois juntos, o servidor continua aberto; com a criptografia em uso, só a aplicação vê o dado.">
