  <g class="tom-vermelho"><rect x="732" y="434" width="196" height="96" rx="16" class="traco-tom pisca"/></g>

  <path d="M300 292 H1140" pathLength="1" class="pacote etapa-1"/>
  <path d="M300 402 H1140" pathLength="1" class="pacote etapa-2"/>
  <path d="M300 512 H1140" pathLength="1" class="pacote etapa-3"/>
  <path d="M300 622 H1140" pathLength="1" class="pacote etapa-4"/>

  <g class="referencia">
    <g data-marca="aplicacao" transform="translate(359 40) scale(.62)"/>
    <g data-marca="servidor" transform="translate(799 40) scale(.62)"/>

    <text x="390" y="146" text-anchor="middle" class="titulo-caixa">Aplicação</text>
    <text x="390" y="176" text-anchor="middle" class="texto-caixa">o driver</text>
    <text x="610" y="146" text-anchor="middle" class="titulo-caixa">Rede</text>
    <text x="610" y="176" text-anchor="middle" class="texto-caixa">o caminho</text>
    <text x="830" y="146" text-anchor="middle" class="titulo-caixa">Servidor</text>
    <text x="830" y="176" text-anchor="middle" class="texto-caixa">a memória do banco</text>
    <text x="1050" y="146" text-anchor="middle" class="titulo-caixa">Disco</text>
    <text x="1050" y="176" text-anchor="middle" class="texto-caixa">backups e snapshots</text>
  </g>
  <g class="tom-petroleo"><text x="40" y="258" class="titulo-caixa texto-tom">Em trânsito</text></g>
  <g class="tom-petroleo"><text x="40" y="288" class="texto-caixa">TLS</text></g>
  <g class="tom-ambar"><text x="40" y="368" class="titulo-caixa texto-tom">Em repouso</text></g>
  <g class="tom-ambar"><text x="40" y="398" class="texto-caixa">disco cifrado</text></g>
  <g class="tom-petroleo tom-ambar"><text x="40" y="478" class="titulo-caixa">Os dois juntos</text></g>
  <g class="tom-vermelho"><text x="40" y="508" class="texto-caixa texto-tom">o servidor fica aberto</text></g>
  <g class="tom-roxo"><text x="40" y="588" class="titulo-caixa texto-tom">Em uso</text></g>
  <g class="tom-roxo"><text x="40" y="618" class="texto-caixa">só a aplicação abre</text></g>

  <g class="legenda tom-petroleo"><rect x="40" y="668" width="22" height="16" rx="3" class="lavado"/><text x="72" y="682" class="nota-pequena">cifrado na rede</text></g>
  <g class="legenda tom-ambar"><rect x="300" y="668" width="22" height="16" rx="3" class="lavado"/><text x="332" y="682" class="nota-pequena">cifrado no disco</text></g>
  <g class="legenda tom-roxo"><rect x="570" y="668" width="22" height="16" rx="3" class="lavado"/><text x="602" y="682" class="nota-pequena">cifrado até no servidor</text></g>
  <g class="legenda tom-vermelho"><rect x="890" y="668" width="22" height="16" rx="3" class="lavado"/><text x="922" y="682" class="nota-pequena">em texto claro</text></g>
</svg>
