<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1370"
  aria-label="Diagrama de sequência em seis passos, do repositório no GitHub à sessão aberta na sua máquina: o repositório claude-code-kit guarda o catálogo, marketplace.json, e a pasta csr-cockpit com version 1.0.0; o marketplace add clona o catálogo para a máquina, onde ele se chama cesarschutz; o install copia a pasta do plugin, na 1.0.0; commits novos chegam ao repositório, mas o version fica parado, e nada muda na máquina; o version sobe para 1.1.0, o update renova o catálogo e copia a pasta nova; e a sessão que já estava aberta segue na 1.0.0 até o /reload-plugins, que carrega a 1.1.0. Só o version novo chega, e a sessão aberta precisa de /reload-plugins.">
