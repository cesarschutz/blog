<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 990"
  aria-label="Dois diagramas de sequência lado a lado, em seis passos, com as transações A e B debitando 10 da mesma conta, que começa com saldo 100. À esquerda, o bloqueio otimista: A e B leem a version 1; A grava 90 se a version ainda é 1, e a linha passa à version 2; B tenta gravar com a version 1 e recebe UPDATE 0, zero linhas, porque a versão mudou; B relê 90 e a version 2 e grava 80. À direita, o bloqueio pessimista: A lê com FOR UPDATE e trava a linha; B pede a mesma linha e espera a trava; A grava 90 e faz COMMIT, e a trava sai; B lê 90 e grava 80. Os dois terminam com saldo 80: no otimista, B refaz o trabalho; no pessimista, B espera a vez.">
