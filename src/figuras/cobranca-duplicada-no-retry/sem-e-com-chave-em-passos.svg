<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 970"
  aria-label="Comparação em quatro passos, em duas metades lado a lado, da mesma falha de rede sem e com a chave de idempotência. Nas duas, o app pede R$ 250, o serviço cobra no adquirente, que aprova, e a resposta 201 se perde no caminho de volta; com a chave, o app manda a chave junto, e o serviço grava a chave na tabela cobranca antes de cobrar e guarda o 201 depois. Sem a chave: o app tenta de novo, e o serviço cobra outra vez; o cliente paga duas vezes. Com a chave: o app tenta de novo com a mesma chave, a restrição UNIQUE da tabela cobranca recusa a chave repetida, e o serviço devolve o 201 guardado; o cliente paga uma vez só.">
