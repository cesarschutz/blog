<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"
  aria-label="Diagrama dos dois mappers: o mesmo pedido vai para o objectMapper, que escreve tudo na resposta da API, e para o logMapper, onde passa pelo mixin, pelo FilterProvider e pelo MascaraCartaoFilter e sai no log mascarado e sem o CVV.">
  <g class="tinta">
    <g class="tom-azul">
      <rect x="37" y="257" width="280" height="200" rx="12" class="hachura"/>
      <rect x="30" y="250" width="280" height="200" rx="12" class="lavado"/>
      <rect x="30" y="250" width="280" height="200" rx="12" class="linha"/>
      <path d="M170 250 V116 C 170 106 176 100 186 100 H396 M382 91 L396 100 L382 109" class="linha-tom"/>
    </g>

    <g class="tom-petroleo">
      <rect x="400" y="30" width="300" height="140" rx="12" transform="translate(7 6)" class="cor"/>
      <rect x="400" y="30" width="300" height="140" rx="12" class="lavado"/>
      <rect x="400" y="30" width="300" height="140" rx="12" class="linha"/>
      <path d="M700 100 H772 M758 91 L772 100 L758 109" class="linha-tom"/>
      <rect x="360" y="200" width="460" height="465" rx="16" class="lavado"/>
      <rect x="360" y="200" width="460" height="465" rx="16" class="linha"/>
    </g>
    <g class="tom-azul">
      <path d="M310 335 H386 M372 326 L386 335 L372 344" class="linha-tom"/>
    </g>

    <g class="tom-petroleo">
      <rect x="787" y="37" width="380" height="140" rx="10" class="hachura"/>
      <rect x="780" y="30" width="380" height="140" rx="10" class="papel"/>
      <rect x="780" y="30" width="380" height="140" rx="10" class="linha"/>
    </g>

    <g class="tom-ambar">
      <rect x="390" y="280" width="400" height="90" rx="10" class="lavado"/>
      <rect x="390" y="280" width="400" height="90" rx="10" class="linha"/>
      <path d="M590 370 V404 M581 392 L590 406 L599 392" class="linha-tom"/>
    </g>
    <g class="tom-roxo">
      <rect x="390" y="410" width="400" height="90" rx="10" class="lavado"/>
      <rect x="390" y="410" width="400" height="90" rx="10" class="linha"/>
      <path d="M590 500 V534 M581 522 L590 536 L599 522" class="linha-tom"/>
    </g>
    <g class="tom-verde">
      <rect x="390" y="540" width="400" height="90" rx="10" class="lavado"/>
      <rect x="390" y="540" width="400" height="90" rx="10" class="linha"/>
      <path d="M790 585 H862 M848 576 L862 585 L848 594" class="linha-tom"/>
    </g>

    <g class="tom-verde">
      <rect x="875" y="477" width="285" height="170" rx="10" class="hachura"/>
      <rect x="868" y="470" width="285" height="170" rx="10" class="papel"/>
      <rect x="868" y="470" width="285" height="170" rx="10" class="linha"/>
    </g>
  </g>

  <g class="tom-azul">
    <path d="M170 246 V116 C 170 106 176 100 186 100 H390" pathLength="1" class="pacote etapa-1"/>
    <path d="M314 335 H380" pathLength="1" class="pacote etapa-1"/>
  </g>
  <g class="tom-petroleo">
    <path d="M704 100 H766" pathLength="1" class="pacote etapa-2"/>
  </g>
  <g class="tom-ambar">
    <path d="M590 374 V400" pathLength="1" class="pacote etapa-3"/>
  </g>
  <g class="tom-roxo">
    <path d="M590 504 V530" pathLength="1" class="pacote etapa-4"/>
  </g>
  <g class="tom-verde">
    <path d="M794 585 H856" pathLength="1" class="pacote etapa-5"/>
  </g>

  <g class="tom-azul">
    <g data-marca="java" transform="translate(236 258) scale(0.56)"/>
  </g>
  <g class="tom-petroleo">
    <g data-marca="spring" transform="translate(638 42) scale(0.5)"/>
    <g data-marca="spring" transform="translate(758 212) scale(0.5)"/>
  </g>

  <g class="tom-azul">
    <text x="50" y="296" class="titulo-caixa">Pedido</text>
    <text x="50" y="340" class="texto-caixa">cartao:</text>
    <text x="50" y="386" class="codigo">5502091234567890</text>
    <text x="50" y="426" class="codigo">cvv 123</text>
  </g>
  <g class="tom-petroleo">
    <text x="420" y="90" class="titulo-caixa">objectMapper</text>
    <text x="420" y="134" class="texto-caixa">@Primary: a API</text>
    <text x="384" y="248" class="titulo-caixa">logMapper</text>
  </g>
  <g class="tom-petroleo">
    <text x="800" y="78" class="titulo-caixa">Resposta da API</text>
    <text x="800" y="122" class="codigo">5502091234567890</text>
    <text x="800" y="156" class="codigo">cvv 123</text>
  </g>

  <g class="tom-ambar">
    <circle cx="762" cy="306" r="18" class="selo"/>
    <text x="762" y="307" class="selo-texto">1</text>
    <text x="410" y="316" class="titulo-caixa">mixin em Object</text>
    <text x="410" y="352" class="codigo">@JsonFilter("logFilter")</text>
  </g>
  <g class="tom-roxo">
    <circle cx="762" cy="436" r="18" class="selo"/>
    <text x="762" y="437" class="selo-texto">2</text>
    <text x="410" y="446" class="titulo-caixa">FilterProvider</text>
    <text x="410" y="482" class="texto-caixa">liga "logFilter" ao filtro</text>
  </g>
  <g class="tom-verde">
    <circle cx="762" cy="566" r="18" class="selo"/>
    <text x="762" y="567" class="selo-texto">3</text>
    <text x="410" y="576" class="titulo-caixa">MascaraCartaoFilter</text>
    <text x="410" y="612" class="texto-caixa">remove, mascara ou segue</text>
    <circle cx="1126" cy="496" r="18" class="selo"/>
    <text x="1126" y="497" class="selo-texto">4</text>
    <text x="888" y="512" class="titulo-caixa">JSON do log</text>
    <text x="888" y="562" class="codigo texto-tom">550209******7890</text>
  </g>
  <g class="tom-vermelho tom-verde">
    <text x="888" y="606" class="nota-pequena texto-tom">sem o cvv</text>
  </g>

  <g class="legenda tom-azul"><rect x="40" y="686" width="22" height="16" rx="3" class="lavado"/><text x="72" y="700" class="nota-pequena">pedido</text></g>
  <g class="legenda tom-petroleo"><rect x="190" y="686" width="22" height="16" rx="3" class="lavado"/><text x="222" y="700" class="nota-pequena">mappers</text></g>
  <g class="legenda tom-ambar"><rect x="350" y="686" width="22" height="16" rx="3" class="lavado"/><text x="382" y="700" class="nota-pequena">mixin</text></g>
  <g class="legenda tom-roxo"><rect x="480" y="686" width="22" height="16" rx="3" class="lavado"/><text x="512" y="700" class="nota-pequena">provider</text></g>
  <g class="legenda tom-verde"><rect x="640" y="686" width="22" height="16" rx="3" class="lavado"/><text x="672" y="700" class="nota-pequena">filtro</text></g>
</svg>
