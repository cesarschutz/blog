<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estilo dos desenhos: A, C e a mistura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Besley:ital,wght@0,400..900;1,400..700&family=Literata:ital,opsz,wght@0,7..72,300..800;1,7..72,300..600&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#ECEEE9; --paper-hi:#F7F8F4; --well:#E0E3DC;
  --ink:#1C2427; --ink-2:#56605E; --ink-3:#7A8381;
  --rule:#C4CAC3;
  --link:#244A8A;
  --acc:#1F4D4A; --acc2:#E3A83A;
  --accd:var(--acc);
  --lift:0 1px 0 rgba(28,36,39,.05),0 18px 34px -18px rgba(28,36,39,.45);
  --display:"Besley","Rockwell","Georgia",serif;
  --text:"Literata","Iowan Old Style","Georgia",serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --blend:multiply;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#182022; --paper-hi:#1F282A; --well:#12181A;
    --ink:#E3E6DF; --ink-2:#A7AFAB; --ink-3:#848D89;
    --rule:#343E40; --link:#9FB8E8;
    --accd:color-mix(in oklab,var(--acc),#ffffff 42%);
    --lift:0 18px 34px -16px rgba(0,0,0,.75);
    --blend:normal;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#182022; --paper-hi:#1F282A; --well:#12181A;
  --ink:#E3E6DF; --ink-2:#A7AFAB; --ink-3:#848D89;
  --rule:#343E40; --link:#9FB8E8;
  --accd:color-mix(in oklab,var(--acc),#ffffff 42%);
  --lift:0 18px 34px -16px rgba(0,0,0,.75);
  --blend:normal;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.6;font-variant-numeric:oldstyle-nums proportional-nums}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding-left:clamp(18px,5vw,48px);padding-right:clamp(18px,5vw,48px)}

/* ---------- barra do protótipo ---------- */
.proto{background:var(--well);border-bottom:1px solid var(--rule);font-size:15px;line-height:1.5}
.proto .wrap{padding-top:18px;padding-bottom:14px}
.proto h1{font-family:var(--display);font-size:18px;font-weight:700;margin:0 0 12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:7px 15px;cursor:pointer;min-height:40px}
.tab:hover{border-color:var(--ink-3)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.proto-desc{margin:12px 0 0;max-width:78ch}
.proto-ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:4px 24px;margin-top:8px;color:var(--ink-2);font-size:14.5px}
.proto-ctrl label{display:inline-flex;align-items:center;gap:8px;min-height:36px}
.proto-ctrl select{background:var(--paper-hi);border:1px solid var(--rule);border-radius:4px;padding:4px 8px}
.lbl{background:var(--well);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);font-size:15px;line-height:1.5}
.lbl .wrap{padding-top:12px;padding-bottom:12px}
.lbl strong{font-family:var(--display);font-size:17px;margin-right:10px}
.lbl span{color:var(--ink-2)}
.sec{padding-top:32px;padding-bottom:48px}

/* ---------- lugares onde a imagem aparece ---------- */
.ph{display:block;position:relative;overflow:hidden;border-radius:3px;background:var(--paper-hi);box-shadow:inset 0 0 0 1px var(--rule)}
.ph svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ph-card{aspect-ratio:3/2}
.ph-hero{aspect-ratio:1100/468}
.feat{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:center}
.feat h2{font-family:var(--display);font-weight:800;font-size:clamp(28px,3.6vw,40px);line-height:1.08;margin:8px 0 8px}
.meta{font-size:14.5px;color:var(--ink-2);display:flex;align-items:center;gap:8px;margin:0;flex-wrap:wrap}
.chip{flex:0 0 auto;width:8px;height:20px;border-radius:1.5px;background:var(--acc);box-shadow:inset 0 3px 0 rgba(255,255,255,.2),inset 0 -3px 0 rgba(255,255,255,.2)}
.sub{margin:0;color:var(--ink-2);font-size:18px;line-height:1.45}
.tags{margin:12px 0 0;font-size:14.5px;display:flex;flex-wrap:wrap;gap:2px 14px}
.tags a{color:var(--ink-2);text-decoration:none;padding:4px 0}
.tags a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:.2em}
@media (max-width:760px){.feat{grid-template-columns:minmax(0,1fr);gap:18px}}

.art-h{max-width:760px;margin:0 auto 28px}
.art-h h1{font-family:var(--display);font-weight:800;font-size:clamp(36px,5.4vw,58px);line-height:1.02;letter-spacing:-.012em;margin:12px 0 12px}
.hero{margin:0}
.hero figcaption{max-width:760px;margin:12px auto 0;font-size:14.5px;color:var(--ink-2);font-style:italic}

.og{container-type:inline-size;aspect-ratio:1200/630;display:grid;grid-template-columns:56% 44%;background:var(--paper-hi);border-radius:4px;box-shadow:var(--lift);overflow:hidden;max-width:880px}
.og.grid{background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);background-size:14px 14px}
.og-txt{display:flex;flex-direction:column;padding:6cqw 3cqw 5cqw 6cqw;min-width:0}
.og-blog{font-family:var(--display);font-weight:800;font-size:2.5cqw;line-height:1}
.og-title{font-family:var(--display);font-weight:800;font-size:6.4cqw;line-height:1.02;margin-top:auto;letter-spacing:-.01em}
.og-sub{font-size:2.6cqw;color:var(--ink-2);margin-top:1.6cqw;line-height:1.3}
.og-cat{display:flex;align-items:center;gap:1.2cqw;font-size:2.2cqw;color:var(--ink-2);margin-top:3cqw}
.og-cat .chip{width:.9cqw;height:2.4cqw}
.og-art{position:relative}
.og-art svg{position:absolute;inset:0;width:100%;height:100%}
.og-note{font-size:14.5px;color:var(--ink-2);margin:12px 0 0}

.dgm{max-width:760px;margin:0 auto;border-radius:4px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--rule);background:var(--paper-hi)}
.dgm svg{display:block;width:100%;height:auto}
.dgm-note{max-width:760px;margin:12px auto 0;font-size:14.5px;color:var(--ink-2)}

/* anotações só aparecem nas imagens grandes */
.anno{display:none}
.show-anno .anno{display:inline}
@media (max-width:600px){.show-anno .anno{display:none}}

/* ---------- A: caderno de engenharia ---------- */
.a-ink path,.a-ink rect,.a-ink circle{stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.a-paper{fill:var(--paper-hi)}
.a-ghost{fill:none;stroke-dasharray:10 9}
.a-ghost-l{fill:none;stroke-dasharray:6 8;opacity:.55}
.a-l{fill:none}
.a-fill{fill:color-mix(in oklab,var(--accd) 62%,var(--paper-hi));stroke:none!important}
.a-stamp{fill:none;stroke:var(--accd)!important}
.a-stamp-t{fill:var(--accd);font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.06em}
.a-t{font-family:var(--text);font-style:italic;font-size:26px;fill:var(--ink)}
.a-amt{font-family:var(--display);font-weight:700;font-size:40px;fill:var(--ink)}
.a-code{font-family:var(--mono);font-size:25px;fill:var(--ink)}
.a-note{font-family:var(--text);font-style:italic;font-size:25px;fill:var(--ink)}
.a-note-s{font-family:var(--text);font-style:italic;font-size:20px;fill:var(--ink-2)}
.a-lead{fill:none;stroke:var(--ink-2);stroke-width:1.8;stroke-linecap:round}
.a-okline{stroke:var(--accd)!important}
.ad text{font-family:var(--text);font-style:italic;fill:var(--ink);font-size:17px}
.ad .s{font-size:13.5px;fill:var(--ink-2)}
.ad .c{font-family:var(--mono);font-style:normal;font-size:12.5px}
.ad .ok{fill:var(--accd);font-weight:600}

/* ---------- A + C ---------- */
.ac-hatch{fill:url(#hatch);stroke:none!important;opacity:.75}
.ac-ph{fill:none;stroke-dasharray:24 8 4 8 4 8!important}

/* ---------- B: impressão em duas cores ---------- */
.mb{mix-blend-mode:var(--blend)}
.b1{fill:var(--accd)}
.b2{fill:var(--acc2)}
.b1dots{fill:url(#dots)}
.bpaper{fill:var(--paper)}
.b-t{font-family:var(--text);font-style:italic;font-size:26px;fill:var(--accd)}
.b-l{fill:none;stroke:var(--accd);stroke-width:5;stroke-linecap:round}
.b-amt{font-family:var(--display);font-weight:800;font-size:42px;fill:var(--accd)}
.b-stamp{fill:none;stroke:var(--accd);stroke-width:4}
.b-stamp-t{fill:var(--accd);font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.06em}
.b-str{fill:none;stroke:var(--accd);stroke-width:4;stroke-linecap:round}
.b-code{font-family:var(--mono);font-size:27px;font-weight:700;fill:var(--accd)}
.grain{opacity:.3;mix-blend-mode:var(--blend);pointer-events:none}
.bd text{font-family:var(--text);font-size:16px;fill:var(--accd)}
.bd .on-acc{fill:var(--paper-hi);font-family:var(--display);font-weight:700}
.bd .bx{font-family:var(--display);font-weight:700;font-size:17px}
.bd .s{font-size:13.5px;fill:var(--ink-2)}
.bd .c{font-family:var(--mono);font-size:12.5px}
.bd .ln{fill:none;stroke:var(--accd);stroke-width:3.5;stroke-linecap:round}
.bd .ln2{fill:none;stroke:var(--acc2);stroke-width:3.5;stroke-linecap:round}

/* ---------- C: desenho de patente ---------- */
.c-ph{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-dasharray:22 6 3 6 3 6;vector-effect:non-scaling-stroke}
.c-hatch{fill:url(#hatch);stroke:var(--ink);stroke-width:1.4;vector-effect:non-scaling-stroke}
.c-top{fill:var(--paper-hi);stroke:var(--ink);stroke-width:1.8;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.c-tag{fill:color-mix(in oklab,var(--accd) 38%,var(--paper-hi));stroke:var(--ink);stroke-width:1.8;vector-effect:non-scaling-stroke}
.c-l{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;vector-effect:non-scaling-stroke}
.c-t{font-family:var(--text);font-size:24px;fill:var(--ink)}
.c-amt{font-family:var(--display);font-weight:700;font-size:36px;fill:var(--ink)}
.c-stamp{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.06em;fill:var(--ink)}
.c-code{font-family:var(--mono);font-size:24px;fill:var(--ink)}
.c-lead{fill:none;stroke:var(--ink);stroke-width:1.4}
.c-num{font-family:var(--text);font-size:26px;fill:var(--ink)}
.c-fig{font-family:var(--text);font-style:italic;font-size:28px;fill:var(--ink)}
.cd text{font-family:var(--text);font-size:15px;fill:var(--ink)}
.cd .bx{font-family:var(--display);font-weight:600;font-size:16px}
.cd .s{font-size:13px;fill:var(--ink-2)}
.cd .c{font-family:var(--mono);font-size:12px}
.cd .ok{fill:var(--accd);font-weight:600}
.cd .ln{fill:none;stroke:var(--ink);stroke-width:1.3}
.cd .ln.ok{stroke:var(--accd)}
.cd .hd{fill:var(--ink)}
.cd .hd.ok{fill:var(--accd)}
.cd .box{fill:var(--paper-hi);stroke:var(--ink);stroke-width:1.3}
.cd .sh{fill:url(#hatch);stroke:none}
.cd .ph{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-dasharray:14 4 2 4}
.cd .rt{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-dasharray:6 4}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0 H0 V24" style="fill:none;stroke:var(--rule);stroke-width:1"/></pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(20)"><circle cx="5" cy="5" r="2.3" style="fill:var(--accd)"/></pattern>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--ink);stroke-width:1"/></pattern>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="t"/>
      <feColorMatrix in="t" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g"><feFuncA type="table" tableValues="0 0.85"/></feComponentTransfer>
    </filter>
  </defs>
</svg>

<div class="proto">
  <div class="wrap">
    <h1>Estilo dos desenhos: A, C e uma mistura dos dois</h1>
    <div class="tabs" role="tablist" aria-label="Estilos">
      <button class="tab" role="tab" data-s="A" aria-selected="true">A. Caderno, sem quadriculado</button>
      <button class="tab" role="tab" data-s="AC" aria-selected="false">A + C. Caderno com traços de patente</button>
      <button class="tab" role="tab" data-s="C" aria-selected="false">C. Desenho de patente</button>
    </div>
    <p class="proto-desc" id="desc"></p>
    <div class="proto-ctrl">
      <label>Cor do livro <select id="cat"><option value="arq">Arquitetura</option><option value="java">Java</option><option value="obs">Observabilidade</option></select></label>
      <label>Tema <select id="theme"><option value="">Do sistema</option><option value="light">Claro</option><option value="dark">Escuro</option></select></label>
      <span>O desenho é o mesmo em todos os lugares; só o recorte muda.</span>
    </div>
  </div>
</div>

<main id="view"></main>

<script>
(() => {
  const $ = id => document.getElementById(id);

  const CATS = {
    arq:  {name:'Arquitetura',     acc:'#1F4D4A', acc2:'#E3A83A'},
    java: {name:'Java',            acc:'#7A3E25', acc2:'#E3A83A'},
    obs:  {name:'Observabilidade', acc:'#9C7A26', acc2:'#3F5878'}
  };
  const S = {style:'A', cat:'arq'};

  /* ---------- geometria compartilhada ---------- */
  function receipt(x, y, w, h, n = 12){
    const tw = w / n;
    let d = `M${x} ${y} H${x+w} V${y+h}`;
    for (let i = 0; i < n; i++) d += ` L${(x+w-(i+.5)*tw).toFixed(1)} ${y+h+14} L${(x+w-(i+1)*tw).toFixed(1)} ${y+h}`;
    return d + ' Z';
  }
  const KEY = 'M50 0 A50 50 0 1 1 -50 0 A50 50 0 1 1 50 0 Z M6 0 A16 16 0 1 0 -26 0 A16 16 0 1 0 6 0 Z M46 -14 H62 V-9 H280 V30 H262 V20 H244 V38 H226 V24 H210 V9 H62 V14 H46 Z';
  const TAG = 'M0 20 L24 0 H170 V90 H24 L0 70 Z';
  const BG = f => `<rect x="-600" y="-600" width="2400" height="2000" style="fill:${f}"/>`;

  /* ---------- A: caderno de engenharia ---------- */
  function drawA(o = {}){
    return `${o.bg === false ? '' : BG('var(--paper-hi)')}
    <g class="a-ink" filter="url(#wobble)">
      <g transform="rotate(-8 505 370)">
        <path d="${receipt(380,180,250,380)}" class="a-ghost"/>
        <path d="M408 236 H560 M408 262 H520 M408 288 H545" class="a-ghost-l"/>
      </g>
      <g transform="rotate(4 595 405)">
        <path d="${receipt(470,215,250,380)}" class="a-paper"/>
        <path d="M498 296 H668 M498 320 H628 M498 344 H648 M498 446 H618" class="a-l"/>
        <g transform="rotate(-12 620 520)"><rect x="548" y="494" width="144" height="54" rx="6" class="a-stamp"/></g>
      </g>
      <path d="M875 286 C905 320 925 385 915 428" class="a-l"/>
      <g transform="translate(905 380) rotate(14)">
        <path d="${TAG}" transform="translate(7 6)" class="a-fill"/>
        <path d="${TAG}" class="a-l"/>
        <circle cx="22" cy="45" r="8" class="a-l"/>
      </g>
      <g transform="translate(840 250) rotate(128)">
        <path d="${KEY}" fill-rule="evenodd" class="a-paper"/>
        <path d="M72 0 H200" class="a-l"/>
      </g>
    </g>
    <g transform="rotate(4 595 405)">
      <text x="498" y="266" class="a-t">Comprovante</text>
      <text x="498" y="416" class="a-amt">R$ 150,00</text>
      <g transform="rotate(-12 620 520)"><text x="620" y="532" text-anchor="middle" class="a-stamp-t">PAGO</text></g>
    </g>
    <g transform="translate(905 380) rotate(14)"><text x="44" y="55" class="a-code">abc-123</text></g>
    <g class="anno">
      <path d="M962 502 C 972 520 966 534 952 546" class="a-lead"/>
      <text x="880" y="572" class="a-note">chave de idempotência</text>
      <text x="880" y="598" class="a-note-s">a mesma nas duas tentativas</text>
      <path d="M370 352 C 352 356 344 362 338 372" class="a-lead"/>
      <text x="126" y="398" class="a-note">a segunda cobrança</text>
      <text x="126" y="424" class="a-note-s">nunca acontece</text>
    </g>`;
  }

  /* ---------- A + C: caderno com o vocabulário da patente ---------- */
  function drawAC(o = {}){
    return `${o.bg === false ? '' : BG('var(--paper-hi)')}
    <g class="a-ink" filter="url(#wobble)">
      <g transform="rotate(-8 505 370)">
        <path d="${receipt(380,180,250,380)}" class="a-l ac-ph" style="stroke-width:2.4"/>
      </g>
      <g transform="rotate(4 595 405)"><path d="${receipt(470,215,250,380)}" transform="translate(14 14)" class="ac-hatch"/></g>
      <g transform="rotate(4 595 405)">
        <path d="${receipt(470,215,250,380)}" class="a-paper"/>
        <path d="M498 296 H668 M498 320 H628 M498 344 H648 M498 446 H618" class="a-l"/>
        <g transform="rotate(-12 620 520)"><rect x="548" y="494" width="144" height="54" rx="6" class="a-stamp"/></g>
      </g>
      <path d="M875 286 C905 320 925 385 915 428" class="a-l"/>
      <g transform="translate(905 380) rotate(14)">
        <path d="${TAG}" transform="translate(7 6)" class="a-fill"/>
        <path d="${TAG}" class="a-l"/>
        <circle cx="22" cy="45" r="8" class="a-l"/>
      </g>
      <g transform="translate(852 262) rotate(128)"><path d="${KEY}" fill-rule="evenodd" class="ac-hatch"/></g>
      <g transform="translate(840 250) rotate(128)">
        <path d="${KEY}" fill-rule="evenodd" class="a-paper"/>
        <path d="M72 0 H200" class="a-l"/>
      </g>
    </g>
    <g transform="rotate(4 595 405)">
      <text x="498" y="266" class="a-t">Comprovante</text>
      <text x="498" y="416" class="a-amt">R$ 150,00</text>
      <g transform="rotate(-12 620 520)"><text x="620" y="532" text-anchor="middle" class="a-stamp-t">PAGO</text></g>
    </g>
    <g transform="translate(905 380) rotate(14)"><text x="44" y="55" class="a-code">abc-123</text></g>
    <g class="anno">
      <path d="M962 502 C 972 520 966 534 952 546" class="a-lead"/>
      <text x="880" y="572" class="a-note">chave de idempotência</text>
      <text x="880" y="598" class="a-note-s">a mesma nas duas tentativas</text>
      <path d="M370 352 C 352 356 344 362 338 372" class="a-lead"/>
      <text x="126" y="398" class="a-note">a segunda cobrança</text>
      <text x="126" y="424" class="a-note-s">nunca acontece</text>
    </g>`;
  }

  function diagAC(){
    const sh = (x, y, w, h, o = 1) => `<rect x="${x+7}" y="${y+7}" width="${w}" height="${h}" class="ac-hatch" style="opacity:${.75*o}"/>`;
    return `${BG('var(--paper-hi)')}
    <g class="ad">
      <g class="a-ink" filter="url(#wobble)">
        ${sh(10,30,120,86)}${sh(220,30,120,86)}${sh(430,30,120,86,.5)}${sh(170,250,220,68)}
        <rect x="10" y="30" width="120" height="86" rx="4" class="a-paper" style="stroke-width:2"/>
        <rect x="220" y="30" width="120" height="86" rx="4" class="a-paper" style="stroke-width:2"/>
        <rect x="430" y="30" width="120" height="86" rx="4" class="a-paper" style="stroke-width:2;stroke-opacity:.5"/>
