<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>02 · Entrar direto noutra tela · protótipo</title>
<!-- Só no protótipo: Google Fonts e GSAP pelo jsDelivr. No site, @fontsource e o gsap do npm. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Besley:wght@700;800&family=Bitter:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base/site.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/DrawSVGPlugin.min.js"></script>
<style>
  .abertura { position: absolute; inset: 0; z-index: 40; pointer-events: none; display: none; }
  .janela.abrindo .abertura { display: block; }
  .janela.abrindo .pagina { overflow: hidden; }
  /* O papel que cobre tudo; o furo (variante "de dentro") é uma máscara que cresce a partir do caderno. */
  .abertura .papel { position: absolute; inset: 0; background: var(--paper); --r: 0px; --fx: 50%; --fy: 50%; }
  .abertura .papel.furado { -webkit-mask: radial-gradient(circle at var(--fx) var(--fy), transparent var(--r), #000 calc(var(--r) + 1px)); mask: radial-gradient(circle at var(--fx) var(--fy), transparent var(--r), #000 calc(var(--r) + 1px)); }
  /* O caderno "cs": contracapa, miolo e capa presa pela lombada, que abre e fecha. */
  .caderno { position: absolute; left: 0; top: 0; width: 84px; height: 109px; perspective: 520px; }
  .caderno .contra, .caderno .miolo-c, .caderno .capa-c { position: absolute; inset: 0; border-radius: 3px 5px 5px 3px; }
  .caderno .contra { background: var(--marca); filter: brightness(.82); box-shadow: 0 14px 22px -12px rgb(0 0 0 / .45); }
  .caderno .miolo-c { inset: 4px 3px 4px 6px; background: var(--livro-papel); border-radius: 1px 3px 3px 1px; display: grid; align-content: start; gap: 7px; padding: 16px 12px; }
  .caderno .miolo-c i { height: 1px; background: color-mix(in oklab, var(--livro-tinta) 22%, transparent); }
  .caderno .capa-c { transform-origin: 0 50%; transform-style: preserve-3d; }
  .caderno .capa-c .frente, .caderno .capa-c .verso { position: absolute; inset: 0; backface-visibility: hidden; border-radius: inherit; overflow: hidden; }
  .caderno .capa-c .frente svg { width: 100%; height: 100%; display: block; }
  .caderno .capa-c .verso { transform: rotateY(180deg); background: color-mix(in oklab, var(--marca) 50%, var(--livro-papel)); }
  .fio-caixa { position: absolute; left: 0; top: 0; height: 8px; }
  .fio { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .fio-tinta { fill: none; stroke: var(--ink); stroke-width: 1.4; stroke-linecap: round; }
  .abertura .caneta { left: -3.7px; top: -14.3px; }
  .conta { position: absolute; left: 0; right: 0; margin: 0; text-align: center; font: 500 12.5px/1 var(--f-codigo); color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .janela.abrindo .site-topo .marca .mc { visibility: hidden; }
</style>
</head>
<body>
<script src="_base/dados.js"></script>
<script src="_base/site.js"></script>
<script src="_base/transicoes.js"></script>
<script>
gsap.registerPlugin(DrawSVGPlugin);
let variante = "cabecalho";
let tocando = null;
let entrada = "artigo:bloqueio";

SITE.iniciar({
  ficha: `
    <p class="rotulo"><a href="index.html">Protótipos de animação</a> · 02 · entrar direto numa tela que não é a home</p>
    <h1>Entrar direto noutra tela: o caderno carrega e abre a tela pedida</h1>
    <div>
      <p class="ideia">Quem chega por um link de artigo, de livro ou de tag não tem a estante na tela, então a abertura é a de hoje, mais simples: o caderno "cs" no meio e a caneta escrevendo o fio com a contagem até 100. No fim, o caderno <b>abre e fecha</b>, e a tela pedida chega.</p>
      <p class="ideia">Como o caderno não tem um lugar na página (na home, ele ia para o livro grande da abertura), são três jeitos de a tela chegar. Escolha a entrada nos botões "Entrar por…".</p>
    </div>
    <dl class="ficha">
      <dt>Minha sugestão</dt><dd><b>Vai para o cabeçalho</b>: todo o site tem o caderno "cs" na marca do cabeçalho. Depois de abrir e fechar, ele encolhe e pousa lá, e as folhas da tela chegam do fundo, como na troca geral (03). O caderno ganha um lugar em qualquer tela.</dd>
      <dt>De dentro do caderno</dt><dd>O caderno abre e a tela nasce de dentro dele: o papel se abre num círculo a partir das páginas.</dd>
      <dt>A folha sobe</dt><dd>O de hoje: o papel sobe como uma folha tirada da mesa, levando o caderno junto.</dd>
      <dt>Tempo</dt><dd>Cerca de 2,2 s. Um clique ou qualquer tecla pula para o fim.</dd>
      <dt>Movimento reduzido</dt><dd>A tela aparece pronta.</dd>
    </dl>`,
  telas: [["Home", "home"], ["Artigo", "artigo:bloqueio"], ["Categorias", "categorias"], ["Tag", "tag:Spring"]],
  variantes: [{
    rotulo: "A tela chega", padrao: "cabecalho", principal: false, aoMudar: (v) => (variante = v), opcoes: [
      { id: "cabecalho", nome: "Vai para o cabeçalho", dica: "o caderno encolhe e pousa na marca do cabeçalho; as folhas da tela chegam do fundo." },
      { id: "dentro", nome: "De dentro do caderno", dica: "o caderno abre e a tela nasce de dentro dele, num círculo que cresce a partir das páginas." },
      { id: "sobe", nome: "A folha sobe", dica: "o papel sobe como uma folha tirada da mesa, levando o caderno junto (o de hoje)." },
    ],
  }],
  extras: [
    ["Entrar por um artigo", () => entrar("artigo:bloqueio")],
    ["Entrar por Categorias", () => entrar("categorias")],
    ["Entrar por um livro", () => entrar("livro:sre")],
    ["Entrar por uma tag", () => entrar("tag:Spring")],
  ],
  inicial: "artigo:bloqueio",
  legenda: "Use os botões \"Entrar por…\" para simular a chegada de fora direto numa tela.",
  transicao: (ctx) => GERAL.geral(ctx, "frente"),
  bloqueado: () => !!tocando,
  aoIniciar: () => entrar(entrada),
});

const janela = SITE.janela;
janela.insertAdjacentHTML("beforeend", `
  <div class="abertura" aria-hidden="true">
    <div class="papel"></div>
    <div class="caderno">
      <div class="contra"></div>
      <div class="miolo-c"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="capa-c"><div class="frente">${SITE.pecas.marcaSvg("mc")}</div><div class="verso"></div></div>
    </div>
    <div class="fio-caixa">
      <svg class="fio" preserveAspectRatio="none"><path class="fio-tinta"/></svg>
      <svg class="caneta" viewBox="0 0 24 24"><path class="corpo" d="M8.2 13.2 17.4 4a1.4 1.4 0 0 1 2 0l.6.6a1.4 1.4 0 0 1 0 2l-9.2 9.2Z"/><path class="anel" d="m15.6 5.8 2.6 2.6"/><path class="ponta" d="M8.2 13.2 10.8 15.8 4 20Z"/></svg>
    </div>
    <p class="conta">0</p>
  </div>`);
const ov = janela.querySelector(".abertura");
const papel = ov.querySelector(".papel"), caderno = ov.querySelector(".caderno"), capa = ov.querySelector(".capa-c");
const caixaFio = ov.querySelector(".fio-caixa"), svgFio = ov.querySelector(".fio"), tinta = ov.querySelector(".fio-tinta");
const caneta = ov.querySelector(".caneta"), conta = ov.querySelector(".conta");
ov.querySelector(".frente .mc").style.cssText = "width:100%;height:100%";
function caixaJ(el) {
  const r = el.getBoundingClientRect(), j = janela.getBoundingClientRect();
  const x = r.left - j.left, y = r.top - j.top;
  return { x, y, w: r.width, h: r.height, cx: x + r.width / 2, cy: y + r.height / 2 };
}
function limpar() {
  tocando?.kill();
  tocando = null;
  janela.classList.remove("abrindo");
  papel.classList.remove("furado");
  janela.querySelector(".site-topo .marca .mc").style.visibility = "";
  const pg = SITE.atual?.el;
  if (pg) gsap.set(pg.querySelectorAll("[data-u]"), { clearProps: "transform,opacity,visibility,clipPath,willChange,transformOrigin" });
  gsap.set([papel, caderno, capa, caixaFio, conta, caneta], { clearProps: "all" });
}
const pular = () => { if (tocando) tocando.progress(1); };
janela.addEventListener("pointerdown", () => { if (tocando) pular(); });
addEventListener("keydown", (e) => { if (tocando && !e.metaKey && !e.ctrlKey && e.key !== "Tab") pular(); });

async function entrar(rota) {
  entrada = rota;
  limpar();
  const pg = SITE.irDireto(rota);
  pg.scrollTop = 0;
  if (SITE.reduzido()) { SITE.dizer("<b>Movimento reduzido</b>: a tela aparece pronta."); return; }
  await document.fonts.ready;
  janela.classList.add("abrindo");
  const W = janela.clientWidth, H = janela.clientHeight;
  const cel = SITE.celular();
  const novas = SITE.unidades(pg);
  gsap.set(novas, { opacity: 0 });

  // O caderno no meio; o fio embaixo dele, com a contagem.
  const cw = 84, ch = 109;
  const cx = W / 2, cy = H * 0.42;
  gsap.set(caderno, { x: cx - cw / 2, y: cy - ch / 2, scale: 0.92, opacity: 0, transformOrigin: "50% 50%" });
  const w = Math.min(260, W * 0.6);
  svgFio.setAttribute("viewBox", `0 0 ${w} 8`);
  tinta.setAttribute("d", `M1 4.3C${w * 0.17} 3.5 ${w * 0.35} 4.9 ${w * 0.5} 4.1S${w * 0.82} 3.6 ${w - 1} 4.3`);
  gsap.set(caixaFio, { left: cx - w / 2, top: cy + ch / 2 + 34, width: w });
  gsap.set(conta, { top: cy + ch / 2 + 56 });
  gsap.set(tinta, { drawSVG: "0%" });
  const L = tinta.getTotalLength();
  const p = { v: 0 };
  const pintar = () => {
    gsap.set(tinta, { drawSVG: `0% ${p.v * 100}%` });
    const pt = tinta.getPointAtLength(p.v * L);
    gsap.set(caneta, { x: pt.x, y: pt.y - 4 });
    conta.textContent = Math.round(p.v * 100);
  };
  pintar();

  const tl = gsap.timeline({ onComplete: () => { tocando = null; limpar(); } });
  tocando = tl;
  SITE.dizer(`<b>Entrada direta em ${SITE.NOMES[SITE.lerRota(rota).tipo]}</b>: o caderno carrega, abre e fecha, e a tela chega. Um clique pula para o fim.`);

  // 1. o caderno aparece e a caneta escreve o fio (o carregamento), contando até 100
  tl.to(caderno, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 0)
    .to(p, { v: 1, duration: 1.0, ease: "power1.inOut", onUpdate: pintar }, 0.2)
    .to([caneta], { y: "-=10", rotation: 16, opacity: 0, duration: 0.22, ease: "power2.in" }, 1.2);

  // 2. o caderno abre e fecha (a capa gira pela lombada, com peso)
  const t2 = 1.25;
  tl.to(capa, { rotationY: -150, duration: 0.42, ease: "power2.out" }, t2)
    .to(capa, { rotationY: 0, duration: 0.34, ease: "power2.in" }, t2 + 0.5)
    .to(caderno, { scale: 0.97, duration: 0.06, ease: "power1.out", yoyo: true, repeat: 1 }, t2 + 0.84)
    .to([caixaFio, conta], { opacity: 0, duration: 0.25 }, t2 + 0.3);

  // 3. a tela chega
  const t3 = t2 + 0.98;
  const ctx = { novas, W: SITE.palco.clientWidth, H: SITE.palco.clientHeight, celular: cel, sentido: "abre" };
  if (variante === "cabecalho") {
    const alvo = janela.querySelector(".site-topo .marca .mc");
    const ra = caixaJ(alvo);
    tl.to(caderno, { x: ra.cx - cw / 2, y: ra.cy - ch / 2, scale: ra.w / cw, duration: 0.7, ease: "power3.inOut" }, t3)
      .to(papel, { opacity: 0, duration: 0.45, ease: "power1.inOut" }, t3 + 0.15)
      .set(caderno, { opacity: 0 }, t3 + 0.7)
      .call(() => janela.querySelector(".site-topo .marca .mc").style.visibility = "visible", null, t3 + 0.7);
    GERAL.chegarDoFundo(tl, ctx, t3 + 0.3, { passo: 0.1, dur: 1.0 });
  } else if (variante === "dentro") {
    papel.classList.add("furado");
    gsap.set(papel, { "--fx": `${cx}px`, "--fy": `${cy}px`, "--r": "0px" });
    const raio = Math.hypot(Math.max(cx, W - cx), Math.max(cy, H - cy));
    tl.to(capa, { rotationY: -165, duration: 0.4, ease: "power2.out" }, t3)
      .to(caderno, { scale: 1.6, opacity: 0, duration: 0.55, ease: "power2.in" }, t3 + 0.25)
      .to(papel, { "--r": `${raio}px`, duration: 0.8, ease: "power2.inOut" }, t3 + 0.2);
    GERAL.chegarDoFundo(tl, ctx, t3 + 0.45, { passo: 0.09, dur: 0.95 });
  } else {
    tl.to([papel, caderno], { y: "-=" + H, duration: 0.7, ease: "power3.inOut" }, t3);
    GERAL.chegarDoFundo(tl, ctx, t3 + 0.35, { passo: 0.1, dur: 1.0 });
  }
}
</script>
</body>
</html>
