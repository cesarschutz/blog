<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>04 · A chegada em Categorias · protótipo</title>
<!-- Só no protótipo: Google Fonts e GSAP pelo jsDelivr. No site, @fontsource e o gsap do npm. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Besley:wght@700;800&family=Bitter:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base/site.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<style>
  .pg-categorias .cartao-livro { position: relative; }
  /* A ficha ao lado do desfile (como a do A2): o volume e o nome do livro que está pousando. */
  .ficha-livro { position: absolute; left: clamp(20px, 5cqi, 72px); top: 44%; translate: 0 -50%; width: min(30cqi, 380px); display: grid; gap: 10px; }
  .ficha-livro .vol { font: 700 12px/1 var(--f-livro); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-2); }
  .ficha-livro .mascara { overflow: clip; height: 2.3em; display: flex; align-items: flex-end; font: 700 clamp(26px, 3.2cqi, 42px)/1.08 var(--f-titulo); }
  .ficha-livro b { display: block; padding-bottom: .12em; text-wrap: balance; }
  @container janela (max-width: 700px) { .ficha-livro { top: 14px; translate: none; width: auto; right: 18px; } .ficha-livro .mascara { font-size: 24px; } }
  /* O verso do livro (baralho): a contracapa na cor dele, com o ícone. */
  .verso-livro { position: absolute; inset: -1px; border-radius: 14px; background: var(--cor); display: grid; grid-template-rows: 38% 1fr; overflow: hidden; z-index: 5; }
  .verso-livro .faixa { background: var(--livro-papel); display: grid; place-items: center; color: var(--dest); }
  .verso-livro svg { width: 58px; height: 58px; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
  .verso-livro span { align-self: end; justify-self: center; padding-bottom: 18px; font: 700 11px/1 var(--f-livro); letter-spacing: .2em; color: var(--tinta); }
</style>
</head>
<body>
<script src="_base/dados.js"></script>
<script src="_base/site.js"></script>
<script src="_base/transicoes.js"></script>
<script src="_base/caderno.js"></script>
<script>
const rnd = gsap.utils.random;
let estilo = "desfile";

SITE.iniciar({
  ficha: `
    <p class="rotulo"><a href="index.html">Protótipos de animação</a> · 04 · a tela de Categorias</p>
    <h1>A chegada em Categorias: os livros em desfile, depois cada um no seu lugar</h1>
    <div>
      <p class="ideia">O que você pediu: a tela anterior sai como na troca geral (03) e os livros da coleção chegam como os cartões do A2, um depois do outro, do fundo; em vez de caírem para fora da tela, <b>pousam um em cima do outro</b>, numa pilha no meio. Com a pilha pronta, <b>cada um vai para o seu lugar</b> na grade.</p>
      <p class="ideia">Ao lado do desfile, a ficha diz o volume e o nome do livro que está pousando, como a do A2. Também dá para entrar direto em Categorias, sem vir de outra tela: aí a entrada é a do caderno (02), e o desfile começa quando o papel sai.</p>
    </div>
    <dl class="ficha">
      <dt>Minha sugestão</dt><dd>O <b>desfile</b> na primeira vez que a pessoa abre Categorias na visita (cerca de 2,4 s: ele apresenta a coleção), e a <b>pilha que se espalha</b> (1,3 s) nas vezes seguintes, para não cansar quem volta.</dd>
      <dt>Baralho</dt><dd>Uma ideia a mais: os livros saem de um maço, de costas (a contracapa na cor de cada um), são distribuídos em ordem e viram quando chegam.</dd>
      <dt>Voltar</dt><dd>De um livro para Categorias ("← Voltar"), a grade chega pela troca geral, sem desfile: quem volta já conhece a coleção.</dd>
      <dt>Celular</dt><dd>A ficha fica no alto; a pilha, no meio da tela; a distribuição leva cada livro ao lugar dele na coluna.</dd>
      <dt>Movimento reduzido</dt><dd>A tela só troca.</dd>
    </dl>`,
  telas: [["Home", "home"], ["Artigos", "artigos"], ["Categorias", "categorias"], ["Livro", "livro:dados"], ["Tags", "tags"], ["Artigo", "artigo:cronjob"]],
  variantes: [{
    rotulo: "Os livros chegam", padrao: "desfile", principal: false, aoMudar: (v) => (estilo = v), opcoes: [
      { id: "desfile", nome: "Desfile e pilha", dica: "um livro depois do outro, do fundo, pousando numa pilha; depois cada um vai para o seu lugar." },
      { id: "espalha", nome: "A pilha se espalha", dica: "a pilha já chega pronta, do fundo, e se espalha pela grade. Mais curta (1,3 s)." },
      { id: "baralho", nome: "Baralho", dica: "os livros saem de um maço, de costas, são distribuídos em ordem e viram quando chegam." },
    ],
  }],
  extras: [["Entrar direto em Categorias", () => entrarDireto()]],
  inicial: "home",
  legenda: "Vá para Categorias pelo menu (de qualquer tela), ou use \"Entrar direto em Categorias\".",
  transicao: (ctx) => {
    if (ctx.para.tipo !== "categorias" || ctx.sentido === "volta") return GERAL.geral(ctx, "frente");
    SITE.dizer(`<b>${SITE.NOMES[ctx.de.tipo]} → Categorias</b>: a tela anterior sai como na troca geral; os livros chegam (${estilo === "desfile" ? "desfile e pilha" : estilo === "espalha" ? "a pilha se espalha" : "baralho"}).`);
    const tl = gsap.timeline();
    const t0 = GERAL.SAIDAS.frente(tl, ctx);
    chegarCategorias(tl, ctx, t0);
    return tl;
  },
  depois: () => { document.querySelectorAll(".verso-livro").forEach((v) => v.remove()); },
});

function chegarCategorias(tl, ctx, t0) {
  const pg = ctx.para.el, W = ctx.W, H = ctx.H, cel = ctx.celular;
  const topo = pg.querySelector(".topo-pagina");
  const cards = [...pg.querySelectorAll(".cartao-livro")];
  GERAL.chegarDoFundo(tl, { ...ctx, novas: [topo], sentido: "abre" }, t0);
  const P = GERAL.P;
  const S = { x: cel ? W / 2 : W * 0.6, y: cel ? H * 0.56 : H * 0.54 };
  const alvo = cards.map((c) => { const r = SITE.caixa(c); return { dx: S.x - r.cx, dy: S.y - r.cy }; });
  cards.forEach((c, i) => gsap.set(c, { transformPerspective: P, transformOrigin: "50% 50%", zIndex: 10 + i, opacity: 0 }));

  if (estilo === "desfile") {
    const ficha = document.createElement("div");
    ficha.className = "ficha-livro";
    ficha.innerHTML = `<span class="vol">Volume 01</span><div class="mascara"><b>${LIVROS[0].nome}</b></div>`;
    SITE.voo.append(ficha);
    const vol = ficha.querySelector(".vol"), nome = ficha.querySelector("b");
    gsap.set(ficha, { opacity: 0 });
    tl.to(ficha, { opacity: 1, duration: 0.3 }, t0 + 0.2);
    const passo = cel ? 0.12 : 0.13, dur = 0.75, z = cel ? -900 : -1600, k = P / (P - z);
    cards.forEach((c, i) => {
      const t = t0 + 0.15 + i * passo, a = alvo[i];
      tl.fromTo(c,
        cel ? { x: a.dx, y: a.dy - (H * 0.45) / k, z, rotationX: 22, rotationY: 0, rotationZ: rnd(-8, 8), scale: 0.86 }
            : { x: a.dx + (W * 0.3) / k, y: a.dy - (H * 0.5) / k, z, rotationX: 16, rotationY: -30, rotationZ: rnd(-10, 10), scale: 0.86 },
        { x: a.dx, y: a.dy, z: 0, rotationX: 0, rotationY: 0, rotationZ: rnd(-7, 7), scale: 0.86, duration: dur, ease: "power3.out" }, t)
        .to(c, { opacity: 1, duration: 0.25, ease: "none" }, t)
        .call(() => {
          vol.textContent = `Volume ${LIVROS[i].vol}`;
          nome.textContent = LIVROS[i].nome;
          gsap.fromTo(nome, { yPercent: 70, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.24, ease: "power2.out", overwrite: true });
        }, null, t + 0.3);
    });
    const tDist = t0 + 0.15 + (cards.length - 1) * passo + dur + 0.1;
    tl.to(ficha, { opacity: 0, duration: 0.25 }, tDist - 0.1);
    distribuir(tl, cards, tDist);
  } else if (estilo === "espalha") {
    cards.forEach((c, i) => {
      const a = alvo[i];
      tl.fromTo(c, { x: a.dx, y: a.dy, z: -520, rotationZ: rnd(-9, 9), rotationX: 12, scale: 0.86, opacity: 0 },
        { z: 0, rotationX: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, t0 + 0.15 + i * 0.04);
    });
    distribuir(tl, cards, t0 + 0.15 + cards.length * 0.04 + 0.3);
  } else {
    // o maço: os livros empilhados de costas; cada um é tirado, levado ao lugar e vira
    cards.forEach((c, i) => {
      const l = LIVROS[i];
      c.insertAdjacentHTML("beforeend", `<div class="verso-livro" style="--cor:${l.cor};--tinta:${l.tinta};--dest:${l.dest}"><div class="faixa">${SITE.pecas.icone(l.k)}</div><span>VOLUME ${l.vol}</span></div>`);
      const a = alvo[i];
      gsap.set(c, { x: a.dx + i * 0.6, y: a.dy - i * 1.4, rotationZ: rnd(-3, 3), scale: 0.86, zIndex: 30 - i });
      tl.to(c, { opacity: 1, duration: 0.2 }, t0 + 0.1);
    });
    const t1 = t0 + 0.45;
    cards.forEach((c, i) => {
      const t = t1 + i * 0.1, verso = c.querySelector(".verso-livro");
      tl.set(c, { zIndex: 40 + i }, t)
        .to(c, { x: 0, y: 0, rotationZ: 0, scale: 1, duration: 0.55, ease: "power3.inOut" }, t)
        .to(c, { z: 90, duration: 0.27, ease: "power2.out", yoyo: true, repeat: 1 }, t)
        .to(c, { rotationY: 90, duration: 0.15, ease: "power1.in" }, t + 0.5)
        .set(verso, { opacity: 0 }, t + 0.65)
        .fromTo(c, { rotationY: -90 }, { rotationY: 0, duration: 0.24, ease: "power2.out", immediateRender: false }, t + 0.65);
    });
  }
}

/** Da pilha para a grade: sai primeiro o de cima (o último volume); cada um sobe um pouco no caminho. */
function distribuir(tl, cards, t) {
  [...cards].reverse().forEach((c, j) => {
    tl.to(c, { x: 0, y: 0, rotationZ: 0, scale: 1, duration: 0.7, ease: "power3.inOut" }, t + j * 0.06)
      .to(c, { z: 70, duration: 0.35, ease: "power2.out", yoyo: true, repeat: 1 }, t + j * 0.06);
  });
}

function entrarDireto() {
  const pg = SITE.irDireto("categorias");
  pg.scrollTop = 0;
  if (SITE.reduzido()) return SITE.dizer("<b>Movimento reduzido</b>: a tela aparece pronta.");
  const ctx = { para: { el: pg }, W: SITE.palco.clientWidth, H: SITE.palco.clientHeight, celular: SITE.celular() };
  gsap.set(SITE.unidades(pg, true), { opacity: 0 });
  SITE.dizer("<b>Entrada direta em Categorias</b>: o caderno carrega e pousa no cabeçalho; o desfile começa quando o papel sai.");
  const tl = CADERNO.tocar((t, em) => chegarCategorias(t, ctx, em));
  tl.eventCallback("onComplete", () => { CADERNO.limpar(); document.querySelectorAll(".verso-livro").forEach((v) => v.remove()); gsap.set(pg.querySelectorAll("[data-u]"), { clearProps: "transform,opacity,zIndex,transformOrigin,willChange,clipPath" }); SITE.voo.innerHTML = ""; });
}
</script>
</body>
</html>
